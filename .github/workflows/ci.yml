name: CI

on:
  # main: a merge into main runs CI on the merge commit, which is the head of
  # the release workflow's back-merge pull request into develop. GitHub counts
  # push runs toward a pull request's required checks; it does not count
  # workflow_dispatch runs, and the pull_request run of a pull request the
  # workflow token opens waits for the owner's approval.
  push:
    branches: [develop, "release/**", "hotfix/**", main]
  pull_request:
    branches: [develop, "release/**", "hotfix/**", main]
  # Run by the release-cut workflow: a branch it creates with the workflow
  # token starts no push run, so it starts this workflow on the new branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Typecheck / Test / Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage gate)
        run: npm test

      - name: Build
        run: npm run build
