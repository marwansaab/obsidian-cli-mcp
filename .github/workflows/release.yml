# ADR-081 clauses 3, 5, 7 and 8: a merge into main publishes that commit to npm
# through npm trusted publishing (OIDC, no token), with provenance. Only after
# the publication succeeds does it tag the commit vX.Y.Z (annotated), create the
# GitHub Release from the version's CHANGELOG.md section and open the pull
# request main into develop. A failed publication leaves no tag and no Release:
# fix and re-run, or ship a hotfix. If the publication succeeded and a later
# step failed, use "Re-run failed jobs", which keeps the publish job's result
# (re-running all jobs would find the version tagged, or fail to republish).
# A push whose version is already tagged has nothing to release and stops after
# the plan job.
#
# npm's trusted-publisher entry for this package names this file (release.yml)
# and the environment npm.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package.json's version and look for its tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already tagged; nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test (with coverage gate)
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public

  release:
    name: Tag, GitHub Release and back-merge pull request
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Each step below skips what an earlier attempt already did, so
      # "Re-run failed jobs" can finish a job that failed part-way.
      - name: Tag v${{ env.VERSION }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already tagged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: Create the GitHub Release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The v$VERSION Release already exists."
            exit 0
          fi
          node scripts/release.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      # An open pull request main into develop already carries this commit, so
      # only a missing one is opened. A pull request opened with the workflow
      # token starts no pull_request run of CI, so CI is started on main, whose
      # commit is the pull request's head.
      - name: Open the pull request main into develop
        run: |
          if [ -z "$(gh pr list --base develop --head main --state open --json number --jq '.[].number')" ]; then
            gh pr create --base develop --head main \
              --title "chore(release): merge v$VERSION back into develop" \
              --body "Back-merge of v$VERSION from main into develop after its npm publication (ADR-081 clause 8). Merge with a merge commit."
          fi
          gh workflow run ci.yml --ref main
